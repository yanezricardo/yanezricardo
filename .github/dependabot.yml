version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # This limit applies to version updates, not security updates.
    open-pull-requests-limit: 2
    groups:
      site-maintenance:
        applies-to: version-updates
        dependency-type: production
        patterns: ['*']
        update-types: [minor, patch]
      tooling-maintenance:
        applies-to: version-updates
        dependency-type: development
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions-maintenance:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
